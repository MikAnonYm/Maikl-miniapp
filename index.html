<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f7f7f4" />
  <title>MAiKL. — Mini App</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div class="bg-brush brush-a"></div>
  <div class="bg-brush brush-b"></div>
  <main id="app" class="app-shell" aria-live="polite"></main>
  <template id="home-template">
    <section class="screen">
      <header class="brand-head">
        <div>
          <div class="eyebrow">ФРАНЦУЗСКИЙ С</div>
          <h1 class="brand">MAiKL.</h1>
          <p class="tagline">Французский. По-настоящему.</p>
        </div>
        <div class="crown" aria-hidden="true">♛</div>
      </header>
      <div class="intro">
        <h2>ЧТО ТЫ ХОЧЕШЬ?</h2>
        <p>Выбери формат — дальше покажу только нужные шаги.</p>
      </div>
      <div class="cards">
        <button class="nav-card" data-route="zoom"><span class="icon">💻</span><span><strong>ВСТРЕТИТЬСЯ С MAiKL. В ZOOM</strong><small>Уроки, разговорный, консультация</small></span><span class="chev">›</span></button>
        <button class="nav-card" data-route="phone"><span class="icon">📱</span><span><strong>MAiKL. В ТВОЁМ СМАРТФОНЕ</strong><small>Практика, сообщения, звонки, консультация</small></span><span class="chev">›</span></button>
        <button class="nav-card" data-route="services"><span class="icon">🎟</span><span><strong>УСЛУГИ</strong><small>Для студентов, компаний, школ и переводчиков</small></span><span class="chev">›</span></button>
        <button class="nav-card" data-route="plus"><span class="icon">💎</span><span><strong>MAiKL.+</strong><small>Закрытый Telegram • 250 ⭐ / месяц</small></span><span class="chev">›</span></button>
      </div>
    </section>
  </template>
  <script src="app.js"></script>
</body>
</html>
